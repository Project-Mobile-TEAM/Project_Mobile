# Phiên bản nền tảng chung; thành viên tránh tự nâng dependency trong module riêng.
[versions]
agp = "9.5.1"
junit = "4.13.2"
# AndroidX Test mới tương thích cơ chế nhập liệu của emulator Android mới.
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Giữ cố định core 1.17.0 và activity 1.10.1 để tương thích compileSdk = 36 (không nâng core >= 1.18.0).
core = "1.17.0"
activity = "1.10.1"
appcompat = "1.6.1"
material = "1.10.0"
constraintlayout = "2.1.4"
navigation = "2.8.5"
lifecycle = "2.8.7"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
work = "2.10.0"
# Phụ thuộc Phase 6: Media3, Vị trí, WebRTC thoại 1-1, ML Kit Dịch, ExifInterface và Glide (thuần Java 17).
media3 = "1.11.1"
playServicesLocation = "21.4.0"
streamWebrtc = "1.3.10"
mlkitTranslate = "17.0.3"
exifinterface = "1.4.2"
zxing = "3.5.3"
# Giữ Glide 5.0.5 tương thích compileSdk = 36 (Glide 5.0.10 yêu cầu compileSdk >= 37).
glide = "5.0.5"
mockito = "5.14.2"
archTesting = "2.2.0"

[libraries]
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.1.0" }
# Giao diện Material3, Single Activity và MVVM LiveData.
core = { module = "androidx.core:core", version.ref = "core" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
# Lưu cục bộ và mạng (Room, Retrofit, OkHttp, WorkManager).
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
# Media3 ExoPlayer phát audio/video có Bearer token qua OkHttpDataSource (D-03).
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
# Lấy tọa độ GPS qua FusedLocationProviderClient; cố ý không thêm play-services-maps (D-02).
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
# WebRTC thuần Java (org.webrtc.*) cho cuộc gọi thoại 1-1 (D-09, D-12).
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "streamWebrtc" }
# Dịch tin nhắn trên thiết bị EN <-> VI; cố ý không thêm mlkit:language-id (D-13).
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkitTranslate" }
# Đọc chiều xoay EXIF khi nén ảnh trước lúc upload.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
# Tải ảnh có cache và tích hợp OkHttp Bearer token; biên dịch bằng annotationProcessor thuần Java.
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-okhttp3-integration = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
# Bộ công cụ kiểm thử JVM và Android.
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
arch-testing = { module = "androidx.arch.core:core-testing", version.ref = "archTesting" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
