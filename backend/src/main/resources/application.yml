# Profile mặc định cho máy phát triển; biến môi trường vẫn có thể chọn profile khác.
server:
  port: 8080
spring:
  profiles:
    default: dev
  datasource:
    # Spring tự giải quyết tham chiếu ${DB_HOST} bên trong URL lấy từ .env.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool nhỏ tránh chiếm hết kết nối Supabase của các thành viên khác.
      pool-name: UTEChat-HikariCP
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      validation-timeout: 3000
      # Server vẫn khởi động để liveness trả lời khi CSDL tạm thời mất kết nối.
      initialization-fail-timeout: -1
  jdbc:
    template:
      query-timeout: 5s
  flyway:
    # Tự động chạy migration khi backend khởi động để các thành viên không phải chạy SQL tay trên Supabase.
    enabled: ${FLYWAY_ENABLED:true}
    # Ưu tiên kết nối Session/Direct port 5432 từ .env (nếu thiếu FLYWAY_URL thì fallback sang datasource URL và đổi 6543 -> 5432).
    url: ${FLYWAY_URL:${spring.datasource.url:}}
    user: ${FLYWAY_USER:${spring.datasource.username:}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password:}}
    # Chỉ chạy các migration cấu trúc chuẩn trong classpath (không tự chạy seed demo V2 để bảo vệ môi trường production).
    locations: classpath:db/migration
    # Nếu database đã chạy V1/V2 thủ công từ trước (chưa có bảng flyway_schema_history), đánh dấu baseline từ V1 rồi chạy tiếp V3, V4...
    baseline-on-migrate: true
    baseline-version: 1
    # Database demo từng nạp V2 qua CLI (không nằm trong classpath) vẫn pass validateChecksum mà không báo thiếu V2.
    ignore-migration-patterns: "*:missing"
# Bí mật ký JWT lấy từ biến môi trường JWT_SECRET (>= 32 ký tự); không có giá trị mặc định ngoài profile dev.
jwt:
  secret: ${JWT_SECRET:}
  # Một JWT duy nhất sống 30 ngày, không có refresh token (ADR-018).
  expiration-seconds: 2592000
app:
  # Chế độ demo: trả OTP trong response (ADR-002); chỉ bật ở profile dev.
  demo-mode: false
  otp:
    # Giãn cách tối thiểu giữa hai lần gửi OTP cho cùng một số (F-01: 60 giây).
    cooldown-seconds: 60
logging:
  level:
    root: INFO
    # Không bật DEBUG JDBC/Hikari để tránh in cấu hình hoặc thông tin đăng nhập.
    com.utechat.backend: INFO
