# Profile demo cho server dùng chung khi chưa có cổng SMS thật (ADR-002): trả OTP trong response và ghi file otp-local.
# Chạy: SPRING_PROFILES_ACTIVE=demo JWT_SECRET=<chuỗi ngẫu nhiên >= 32 ký tự> java -jar backend.jar
# Khác dev: KHÔNG có JWT_SECRET mặc định (thiếu thì server không khởi động) và không mở CORS rộng.
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
app:
  demo-mode: true
