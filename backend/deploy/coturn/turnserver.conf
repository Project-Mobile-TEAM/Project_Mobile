# ==============================================================================
# UTEChat — Cấu hình mẫu coturn cho EC2 (Secondary IP, TURNS TLS 443 + UDP 3478/443)
# Tham chiếu: ADR-013, docs/DEPLOYMENT_SECURITY.md (Mục 2), Phase 06-02 (D-09)
#
# LƯU Ý BẢO MẬT:
# - KHÔNG ĐƯỢC điền COTURN_SHARED_SECRET thật vào file git này.
# - Thay toàn bộ giá trị placeholder <...> trên máy chủ EC2 thật (ví dụ /etc/turnserver.conf).
# - Gán coturn vào Secondary IP riêng để KHÔNG tranh cổng 443 với Nginx (Primary IP).
# ==============================================================================

# 1. Cổng lắng nghe STUN/TURN (UDP/TCP 3478) và TURNS qua TLS (TCP/DTLS 443)
# Cổng TLS 443 giúp vượt tường lửa doanh nghiệp/trường học chặn UDP 3478.
listening-port=3478
tls-listening-port=443

# 2. Gắn cố định vào Secondary Private IP của EC2 (tránh xung đột cổng 443 với Nginx)
# external-ip có dạng <SECONDARY_PUBLIC_IP>/<SECONDARY_PRIVATE_IP> cho môi trường NAT trên AWS EC2.
listening-ip=<SECONDARY_PRIVATE_IP>
relay-ip=<SECONDARY_PRIVATE_IP>
external-ip=<SECONDARY_PUBLIC_IP>/<SECONDARY_PRIVATE_IP>

# 3. Miền xác thực (realm) khớp hostname chứng chỉ TLS của máy chủ TURN
realm=<turn.utechat.example>
server-name=<turn.utechat.example>

# 4. Cơ chế xác thực tạm thời bằng HMAC-SHA1 (coturn REST API / lt-cred-mech + use-auth-secret)
# Backend tạo username = "<epoch_expiry>:<userId>" và credential = Base64(HMAC-SHA1(secret, username)).
# Chỉ backend và coturn biết static-auth-secret; tuyệt đối không đóng gói vào APK Android.
use-auth-secret
static-auth-secret=<COTURN_SHARED_SECRET>

# 5. Chứng chỉ TLS (Let's Encrypt) và chỉ cho phép TLS 1.2 / TLS 1.3 (tắt TLS 1.0/1.1 yếu)
cert=/etc/letsencrypt/live/<turn.utechat.example>/fullchain.pem
pkey=/etc/letsencrypt/live/<turn.utechat.example>/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# 6. Dải cổng UDP cho lưu lượng media relay (mở trong EC2 Security Group tương ứng)
min-port=49152
max-port=65535

# 7. Bật STUN FINGERPRINT và tắt giao diện quản trị CLI nội bộ
fingerprint
no-cli
stale-nonce=600

# 8. Chống tấn công SSRF qua TURN relay (BẮT BUỘC):
# Chặn tuyệt đối relay tới loopback, multicast, mạng nội bộ VPC (RFC1918) và AWS EC2 IMDS (169.254.169.254).
no-loopback-peers
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# 9. Hạn mức tài nguyên cơ bản chống lạm dụng băng thông
total-quota=200
user-quota=12
max-bps=1048576

# 10. Ghi log gọn nhẹ qua syslog/file, không bật log gói tin nhạy cảm
simple-log
log-file=/var/log/turnserver/turnserver.log
